<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — AutoMarket Studio</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="login">
  <main class="container form-page">
    <h1>Вход в AutoMarket</h1>
    <p class="muted">Войдите в аккаунт, чтобы оформить покупку и управлять профилем.</p>
    <form id="login-form" class="form-card">
      <div class="field">
        <label for="username">Логин</label>
        <input id="username" name="username" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Пароль</label>
        <input id="password" name="password" type="password" required autocomplete="current-password">
      </div>
      <p id="login-message" class="message" hidden></p>
      <button type="submit" class="btn btn-full">Войти</button>
    </form>
    <p class="small muted" style="margin-top:20px;">Нет аккаунта? <a href="/pages/register.html"><strong>Зарегистрироваться</strong></a></p>
  </main>
  <script src="/js/jquery.min.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
