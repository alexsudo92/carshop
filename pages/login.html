<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Вход — AutoMarket Studio</title><link rel="stylesheet" href="../css/styles.css"></head>
<body data-page="login">
  <main class="auth-page">
    <section class="auth-box">
      <h1 class="auth-title">Вход</h1>
      <p class="auth-subtitle">Авторизуйтесь, чтобы открыть каталог и конфигуратор.</p>
      <form id="login-form" class="form-card form-stack">
        <input class="field" name="username" required placeholder="Логин" autocomplete="username">
        <input class="field" name="password" type="password" required placeholder="Пароль" autocomplete="current-password">
        <p id="login-error" class="error-text hidden">Неверный логин или пароль</p>
        <button class="primary-button full-width" type="submit">Войти</button>
      </form>
      <p class="muted">Нет аккаунта? <a href="register.html"><strong>Зарегистрироваться</strong></a></p>
    </section>
  </main>
  <script src="../js/jquery.min.js"></script><script src="../js/app.js"></script>
</body>
</html>
