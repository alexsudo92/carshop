<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация — AutoMarket Studio</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="register">
  <main class="container form-page">
    <h1>Регистрация</h1>
    <p class="muted">Создайте личный кабинет для покупки автомобилей.</p>
    <form id="register-form" class="form-card">
      <div class="field"><label for="reg-fullName">ФИО</label><input id="reg-fullName" required autocomplete="name"></div>
      <div class="field"><label for="reg-phone">Номер телефона</label><input id="reg-phone" required autocomplete="tel"></div>
      <div class="field"><label for="reg-birthDate">Дата рождения</label><input id="reg-birthDate" type="date" required></div>
      <div class="field"><label for="reg-username">Логин</label><input id="reg-username" required autocomplete="username"></div>
      <div class="field"><label for="reg-password">Пароль</label><input id="reg-password" type="password" required autocomplete="new-password"></div>
      <p id="register-message" class="message" hidden></p>
      <button type="submit" class="btn btn-full">Зарегистрироваться</button>
    </form>
    <p class="small muted" style="margin-top:20px;">Уже есть аккаунт? <a href="/pages/login.html"><strong>Войти</strong></a></p>
  </main>
  <script src="/js/jquery.min.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
