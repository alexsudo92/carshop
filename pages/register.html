<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Регистрация — AutoMarket Studio</title><link rel="stylesheet" href="../css/styles.css"></head>
<body data-page="register">
  <main class="auth-page">
    <section class="auth-box">
      <h1 class="auth-title">Регистрация</h1>
      <p class="auth-subtitle">Создайте личный кабинет для покупки автомобилей.</p>
      <form id="register-form" class="form-card form-stack">
        <input class="field" name="fullName" required placeholder="ФИО">
        <input class="field" name="phone" required placeholder="Номер телефона">
        <input class="field" name="birthDate" type="date" required>
        <input class="field" name="username" required placeholder="Логин" autocomplete="username">
        <input class="field" name="password" type="password" required placeholder="Пароль" autocomplete="new-password">
        <p id="register-error" class="error-text hidden">Пользователь с таким логином уже существует</p>
        <button class="primary-button full-width" type="submit">Зарегистрироваться</button>
      </form>
      <p class="muted">Уже есть аккаунт? <a href="login.html"><strong>Войти</strong></a></p>
    </section>
  </main>
  <script src="../js/jquery.min.js"></script><script src="../js/app.js"></script>
</body>
</html>
