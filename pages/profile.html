<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Личный кабинет — AutoMarket Studio</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="profile">
  <header id="site-header" class="site-header"></header>
  <main class="container narrow">
    <h1 id="profile-title">Личный кабинет</h1>
    <p id="profile-message" class="message" hidden></p>
    <form id="profile-form" class="form-card">
      <div class="field"><label for="profile-fullName">ФИО</label><input id="profile-fullName" required autocomplete="name"></div>
      <div class="field"><label for="profile-phone">Номер телефона</label><input id="profile-phone" required autocomplete="tel"></div>
      <div class="field"><label for="profile-birthDate">Дата рождения</label><input id="profile-birthDate" type="date" required></div>
      <div class="field"><label for="profile-password">Пароль</label><input id="profile-password" type="password" required autocomplete="current-password"></div>
      <div class="field"><label for="profile-paymentMethods">Способы оплаты, каждый с новой строки</label><textarea id="profile-paymentMethods" placeholder="Банковская карта **** 0000"></textarea></div>
      <button type="submit" class="btn btn-full">Сохранить изменения</button>
    </form>
  </main>
  <script src="../js/jquery.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
