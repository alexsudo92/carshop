<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Личный кабинет — AutoMarket Studio</title><link rel="stylesheet" href="../css/styles.css"></head>
<body data-page="profile">
  <div id="site-header"></div>
  <main class="page-main container-narrow">
    <h1 class="page-title">Личный кабинет</h1>
    <p id="profile-success" class="success-text hidden">Данные успешно обновлены.</p>
    <form id="profile-form" class="form-card form-stack">
      <input class="field" name="fullName" required placeholder="ФИО">
      <input class="field" name="phone" required placeholder="Телефон">
      <input class="field" name="birthDate" type="date" required>
      <input class="field" name="password" type="password" required placeholder="Пароль">
      <textarea class="field" name="paymentMethods" placeholder="Способы оплаты, каждый с новой строки"></textarea>
      <button class="primary-button full-width" type="submit">Сохранить изменения</button>
    </form>
  </main>
  <script src="../js/jquery.min.js"></script><script src="../js/app.js"></script>
</body>
</html>
